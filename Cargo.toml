[package]
name = "mcp-ticketing"
version = "1.0.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Ticketing MCP Server — a service-desk / case-ticketing platform (queues with SLA policies, tickets with priority and SLA due dates + breach detection, intake & triage, assignment, status workflow, public/internal comments, escalation, tags, and SLA/workload analytics) with a full audit trail"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-ticketing"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "ticketing", "service-desk", "sla", "support"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[workspace]

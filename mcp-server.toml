server_id = "mcp_ticketing"
display_name = "Ticketing / Service Desk"
version = "1.0.0"
domain = "education"
sdk_version = "0.1.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = []
environments = ["development", "staging", "production"]

[[tools]]
name = "create_queue"
description = "Create a queue with an SLA policy"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_queue"
description = "Get a queue and its SLA policy"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_queues"
description = "List queues"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_ticket"
description = "Intake a ticket (auto-computes SLA deadlines)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_ticket"
description = "Get a ticket by id"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_tickets"
description = "List tickets by queue/status/assignee"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "assign_ticket"
description = "Assign a ticket to an agent"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "set_priority"
description = "Set ticket priority (recomputes SLA)"
